apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          # TODO: use the `ollama/ollama:latest` image
          image: ollama/ollama:latest
          # TODO: Add ports
          # Hint: Ollama's API server listens on 11434
          ports:
            - containerPort: 11434
          volumeMounts:
            # TODO: mount the volume at /root/.ollama
            - name: ollama-data
              mountPath: /root/.ollama
          readinessProbe:
            # TODO: check for the port being alive every 5 seconds
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            # TODO: check for the port being alive every 10 seconds
            httpGet:
              path: /
              port: 11434
            periodSeconds: 10
      volumes:
        # TODO: You'll need to configure pvc to make this work
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-data
